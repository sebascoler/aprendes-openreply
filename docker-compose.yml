# OpenReply en el VPS de Aprendes.ai.
#
# Cinco contenedores: web (Next.js: dashboard + webhook), worker (cola de DMs),
# cron (refresco de tokens y jobs periódicos), postgres y redis.
#
# El HTTPS lo da el Traefik que ya corre en el VPS (stack /docker/traefik, red
# host, proveedor Docker con exposedbydefault=false, resolver "letsencrypt").
# No se toca: web se anuncia con labels y Traefik lo descubre solo.
#
# La imagen de la app se construye directo desde el repo upstream, pinneado al
# commit OPENREPLY_REF que está en .env. No hay fork: para actualizar se cambia
# el commit y se reconstruye (scripts/update.sh).
#
# Nada publica puertos al host: Traefik llega a web por la IP interna del
# contenedor, y postgres/redis solo son visibles dentro de la red de compose.

x-openreply: &openreply
  image: aprendes-openreply:${OPENREPLY_REF:-main}
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *openreply
    build:
      context: https://github.com/diwenne/openreply.git#${OPENREPLY_REF:-main}
    # Las migraciones corren al arrancar y no en el build: durante el build no
    # hay red hacia Postgres. El worker y el cron esperan a que web esté sano,
    # así que nunca tocan una base sin migrar.
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.openreply.rule: "Host(`${OPENREPLY_DOMAIN}`)"
      traefik.http.routers.openreply.entrypoints: websecure
      traefik.http.routers.openreply.tls.certresolver: letsencrypt
      traefik.http.services.openreply.loadbalancer.server.port: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /api/health devuelve 503 mientras el worker no reportó latido. Para el
      # healthcheck del contenedor web alcanza con que Next responda.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.status===200||r.status===503?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  worker:
    <<: *openreply
    command: ["npm", "run", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  cron:
    <<: *openreply
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (corré scripts/init-env.sh)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: la cola sobrevive a un reinicio. noeviction: BullMQ lo exige,
    # si Redis descartara claves se perderían jobs en silencio.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
